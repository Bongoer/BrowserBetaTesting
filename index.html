<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e5ebe7">
  <meta name="description" content="A small browser-style web app with tabs and compatibility rendering.">
  <title>Pocket Browser</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/><path d="M5 12h10"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-3.6L6 21Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect width="18" height="12" x="3" y="4" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="14" height="11" x="5" y="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-reader" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v13a1 1 0 0 1-1.4.9L12 16l-7.6 3.9A1 1 0 0 1 3 19V6a2 2 0 0 1 2-2Z"/><path d="M7 8h10M7 11h7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.2 3.1a3 3 0 0 1-1.7 1.7L6 9l3.1 1.2a3 3 0 0 1 1.7 1.7L12 15l1.2-3.1a3 3 0 0 1 1.7-1.7L18 9l-3.1-1.2a3 3 0 0 1-1.7-1.7Z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <main class="browser-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <section class="browser-shell" aria-label="Pocket Browser">
      <div class="tab-strip">
        <button class="brand-mark" id="brand-home" aria-label="Open home page"><svg><use href="#i-sparkles"/></svg></button>
        <div class="tabs-list" id="tabs-list" role="tablist" aria-label="Open tabs"></div>
        <button class="new-tab" id="new-tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
        <div class="window-grip"><span></span><span></span><span></span></div>
      </div>

      <div class="toolbar">
        <div class="nav-buttons">
          <button class="icon-button" id="back" aria-label="Back" disabled><svg><use href="#i-back"/></svg></button>
          <button class="icon-button" id="forward" aria-label="Forward" disabled><svg><use href="#i-forward"/></svg></button>
          <button class="icon-button refresh-button" id="reload" aria-label="Reload" disabled><svg><use href="#i-refresh"/></svg></button>
          <button class="icon-button home-button" id="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
        </div>

        <form class="address-form" id="address-form">
          <span class="address-status"><svg><use id="address-icon" href="#i-search"/></svg></span>
          <input id="address" aria-label="Search or enter address" placeholder="Search or enter a website" autocomplete="off" autocapitalize="none" spellcheck="false">
          <button type="button" class="bookmark-button is-hidden" id="bookmark" aria-label="Bookmark"><svg><use href="#i-bookmark"/></svg></button>
        </form>

        <div class="toolbar-actions">
          <span class="render-badge" id="render-badge">Auto</span>
          <button class="icon-button menu-button" id="menu-button" aria-label="Browser menu" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
        </div>

        <div class="browser-menu" id="browser-menu" aria-hidden="true">
          <div class="menu-row">
            <span class="menu-row-icon"><svg><use href="#i-desktop"/></svg></span>
            <span class="menu-row-label">Desktop site</span>
            <button class="switch" id="desktop-switch" role="switch" aria-checked="false" aria-label="Desktop site"><span></span></button>
          </div>
          <button id="reader-view"><svg><use href="#i-reader"/></svg><span>Recreate readable page</span></button>
          <button id="recreate-view"><svg><use href="#i-refresh"/></svg><span>Recreate full page</span></button>
          <div class="menu-divider"></div>
          <a class="is-hidden" id="open-direct" href="#" target="_blank" rel="noreferrer"><svg><use href="#i-external"/></svg><span>Open page directly</span></a>
        </div>
      </div>

      <div class="browser-content" id="browser-content">
        <div class="load-progress is-hidden" id="load-progress"></div>

        <div class="start-page" id="start-page">
          <div class="start-content">
            <div class="hero-mark"><svg><use href="#i-sparkles"/></svg></div>
            <h1>Where to?</h1>
            <p>Search the web or paste a link.</p>
            <form class="hero-search" id="hero-form">
              <svg><use href="#i-search"/></svg>
              <input id="hero-address" placeholder="Search or type a URL" aria-label="Search the web" autocomplete="off" autocapitalize="none">
              <button aria-label="Go"><svg><use href="#i-chevron"/></svg></button>
            </form>
            <div class="quick-links">
              <button data-url="https://www.google.com"><span class="quick-icon blue">G</span><span>Google</span></button>
              <button data-url="https://www.youtube.com"><span class="quick-icon red">▶</span><span>YouTube</span></button>
              <button data-url="https://www.wikipedia.org"><span class="quick-icon slate">W</span><span>Wikipedia</span></button>
              <button data-url="https://play.fancade.com"><span class="quick-icon orange">F</span><span>Fancade</span></button>
            </div>
          </div>
          <div class="privacy-pill"><svg><use href="#i-shield"/></svg> Auto compatibility rendering</div>
        </div>

        <div class="surfaces" id="surfaces"></div>

        <div class="status-toast" id="status-toast" aria-live="polite">
          <span id="status-text"></span>
          <button id="status-action">Use reader</button>
        </div>
      </div>
    </section>
    <p class="page-caption">POCKET BROWSER <span>•</span> GITHUB PAGES EDITION</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
